name: Smart CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run lint
        run: ruff check src/

  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Чтобы увидеть ВСЕ ошибки сразу, а не только первую
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Ловит БАГ 3 (Windows)
        python-version: ['3.10', '3.11', '3.12']           # Ловит БАГ 1 (Python 3.10)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: pip install build
      - name: Build wheel
        run: python -m build
      - name: Test clean install
        run: |
          # Ставим пакет из собранного файла. Если забыли dependency (БАГ 2) или файл данных (БАГ 4), упадет здесь
          pip install dist/*.whl
          soup

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Build Docker image
        run: docker build -t soup-test .
      - name: Run Docker container
        run: docker run soup-test
